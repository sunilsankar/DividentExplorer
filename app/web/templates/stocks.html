{% extends "base.html" %}

{% block title %}Stocks &bull; Dividend Explorer{% endblock %}

{% block content %}
<div class="section-header">
  <h1 class="section-title">Stock Explorer</h1>
</div>

<form class="form-group" id="stocks-filter-form" hx-get="/stocks/table" hx-target="#stock-table-container" hx-trigger="change, keyup changed delay:300ms from:#q">
  <input type="text" id="q" name="q" value="{{ query or '' }}" placeholder="Search ticker or name..." style="min-width: 280px;">
  
  <select name="asset_type">
    <option value="">All Types (Stocks &amp; ETFs)</option>
    <option value="STOCK" {% if selected_asset_type == 'STOCK' %}selected{% endif %}>Stocks Only</option>
    <option value="ETF" {% if selected_asset_type == 'ETF' %}selected{% endif %}>ETFs Only</option>
  </select>

  <select name="exchange">
    <option value="">All Exchanges</option>
    {% for exch in exchanges %}
    <option value="{{ exch.code }}" {% if selected_exchange == exch.code %}selected{% endif %}>{{ exch.code }} - {{ exch.name }}</option>
    {% endfor %}
  </select>

  <select name="sector">
    <option value="">All Sectors</option>
    {% for sec in sectors %}
    <option value="{{ sec }}" {% if selected_sector == sec %}selected{% endif %}>{{ sec }}</option>
    {% endfor %}
  </select>

  <select name="sort">
    <option value="ticker" {% if sort == 'ticker' %}selected{% endif %}>Sort by Ticker</option>
    <option value="yield" {% if sort == 'yield' %}selected{% endif %}>Sort by Current Yield (High &rarr; Low)</option>
    <option value="quality" {% if sort == 'quality' %}selected{% endif %}>Sort by Quality Score (High &rarr; Low)</option>
    <option value="growth" {% if sort == 'growth' %}selected{% endif %}>Sort by Dividend Growth</option>
    <option value="price_asc" {% if sort == 'price_asc' %}selected{% endif %}>Sort by Price (Low &rarr; High)</option>
    <option value="price_desc" {% if sort == 'price_desc' %}selected{% endif %}>Sort by Price (High &rarr; Low)</option>
  </select>

  <select name="max_price">
    <option value="">All Prices</option>
    <option value="5" {% if selected_max_price == 5 %}selected{% endif %}>Under &euro;/$ 5</option>
    <option value="10" {% if selected_max_price == 10 %}selected{% endif %}>Under &euro;/$ 10</option>
    <option value="20" {% if selected_max_price == 20 %}selected{% endif %}>Under &euro;/$ 20</option>
    <option value="25" {% if selected_max_price == 25 %}selected{% endif %}>Under &euro;/$ 25</option>
    <option value="50" {% if selected_max_price == 50 %}selected{% endif %}>Under &euro;/$ 50</option>
    <option value="100" {% if selected_max_price == 100 %}selected{% endif %}>Under &euro;/$ 100</option>
    <option value="200" {% if selected_max_price == 200 %}selected{% endif %}>Under &euro;/$ 200</option>
  </select>

  <select name="sync_state">
    <option value="">All Sync States</option>
    <option value="never" {% if selected_sync_state == 'never' %}selected{% endif %}>Never Synced</option>
    <option value="stale_7" {% if selected_sync_state == 'stale_7' %}selected{% endif %}>Synced &gt;7d ago</option>
    <option value="stale_30" {% if selected_sync_state == 'stale_30' %}selected{% endif %}>Synced &gt;30d ago</option>
    <option value="failed" {% if selected_sync_state == 'failed' %}selected{% endif %}>Has Failed Job</option>
  </select>

  <select name="page_size">
    <option value="30" {% if page_size == 30 %}selected{% endif %}>30 / page</option>
    <option value="50" {% if page_size == 50 %}selected{% endif %}>50 / page</option>
    <option value="100" {% if page_size == 100 %}selected{% endif %}>100 / page</option>
    <option value="250" {% if page_size == 250 %}selected{% endif %}>250 / page</option>
  </select>

  <span class="htmx-indicator" style="align-self: center; font-size: 0.85rem; color: var(--accent-color);">Loading...</span>
</form>

<div id="stock-table-container">
  {% include "partials/stock_table.html" %}
</div>
{% endblock %}
