<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Dividend Explorer{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/static/img/logo.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/img/favicon-32x32.png">
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
</head>
<body>
  <header>
    <a href="/" class="brand">
      <img src="/static/img/logo.svg" alt="Dividend Explorer logo" class="brand-logo">
      Dividend Explorer
    </a>
    <nav>
      <a href="/" class="{% if active_tab == 'dashboard' %}active{% endif %}">Dashboard</a>
      <a href="/stocks" class="{% if active_tab == 'stocks' %}active{% endif %}">Stocks</a>
      <a href="/stocks?asset_type=ETF" class="{% if active_tab == 'etfs' %}active{% endif %}">ETFs</a>
      <a href="/industries" class="{% if active_tab == 'industries' %}active{% endif %}">Industries</a>
      <a href="/competitors" class="{% if active_tab == 'competitors' %}active{% endif %}">Competitors</a>
      <a href="/calendar" class="{% if active_tab == 'calendar' %}active{% endif %}">Calendar</a>
      <a href="/analytics" class="{% if active_tab == 'analytics' %}active{% endif %}">Analytics</a>
      <a href="/sync" class="{% if active_tab == 'sync' %}active{% endif %}">Sync Status</a>
      <a href="/sync/logs" class="{% if active_tab == 'sync_logs' %}active{% endif %}">Sync Logs</a>
      <a href="/changes" class="{% if active_tab == 'changes' %}active{% endif %}">Changes</a>
    </nav>
    <form action="/stocks" method="get" class="header-search">
      <input type="text" name="q" placeholder="Search ticker or name..." value="{{ query or '' }}">
    </form>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    <p>Dividend Explorer &bull; SQLite Operational Source of Truth &bull; Yahoo Ingestion Only</p>
  </footer>
</body>
</html>
